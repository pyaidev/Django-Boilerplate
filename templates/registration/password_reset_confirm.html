<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset password</title>
<main>
  <h1>Reset password</h1>
  {% if validlink %}
    <form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Save password</button></form>
  {% else %}<p>This reset link is invalid or has expired. Please request a new link.</p>{% endif %}
</main>
</html>
