groups:
  - name: django
    rules:
      - alert: DjangoDown
        expr: up{job="django"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: Django metrics endpoint is unreachable
      - alert: DjangoHighErrorRate
        expr: sum(rate(django_http_responses_total_by_status_total{job="django",status=~"5.."}[5m])) / clamp_min(sum(rate(django_http_responses_total_by_status_total{job="django"}[5m])), 0.001) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: More than 5% of Django responses are server errors
      - alert: DjangoRateLimitSpike
        expr: sum(rate(django_http_responses_total_by_status_total{job="django",status="429"}[5m])) > 1
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Django is rate limiting more than one request per second
